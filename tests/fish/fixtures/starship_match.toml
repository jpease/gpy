# Parity baseline config for tests/fish/starship_parity.test.fish
# This is native Starship's built-in default configuration with three
# documented deviations: the `package`, `username` and `hostname` modules are
# disabled.
#
# GPY's `starship` theme emulates Starship's directory, git, language
# (toolchain version), command-duration, and character modules. It does NOT
# emulate the `package` module (`is 📦 v1.2.3`). Username and hostname come
# from the bundled username/hostname plugins, which GPY draws as flat pills
# rather than Starship's `<name> in ` text (an accepted difference). Leaving
# these modules enabled would therefore produce a guaranteed mismatch that
# reflects an emulation *scope* decision, not a rendering-fidelity bug — so we
# disable them here to keep the comparison focused on modules GPY actually
# claims to reproduce.
#
# Everything else is left at Starship's defaults on purpose: the test asserts
# that GPY renders the same bytes (after ANSI stripping) Starship does.
[package]
disabled = true

[username]
disabled = true

[hostname]
disabled = true
