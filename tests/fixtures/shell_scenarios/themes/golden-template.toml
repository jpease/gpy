# Fixture theme for the cross-shell segment golden test: the clock and status
# carry `format` templates, so the agent renders them (`$time` resolves to each
# shell's own live-time token); hostname and username are the bundled script
# plugins, drawn by the shell.

[ui]
two_line = true

[ui.prompt_open]
icon = ""
icon_color = "transparent"
bg_color = "transparent"

[ui.prompt_close]
icon = ""
icon_color = "match_bg"
bg_color = "black"

[ui.segment_open]
icon = ""
icon_color = "match_bg"
bg_color = "transparent"

[ui.segment_close]
icon = ""
icon_color = "match_bg"
bg_color = "transparent"

[segments.character]
success_symbol = "❯"
success_color = "white"

[segments.clock]
format = "([$sep_open](fg:$bg bg:default))[ $time]($style)([$sep_gap]($style))([$sep_close](fg:$bg bg:default))"
text_color = "white"
bg_color = "blue"
time_format = "24"
show_leading_zero = false
show_seconds = false

[segments.status]
format = "([$sep_open](fg:$bg bg:default))[ $symbol]($style)([$sep_gap]($style))([$sep_close](fg:$bg bg:default))"
ok_icon = "✔"
ok_text_color = "black"
ok_bg_color = "green"
fail_icon = "✖"
fail_text_color = "black"
fail_bg_color = "red"

[segments.hostname]
text_color = "black"
bg_color = "yellow"
ssh_icon = "@"

[segments.username]
text_color = "white"
bg_color = "red"
