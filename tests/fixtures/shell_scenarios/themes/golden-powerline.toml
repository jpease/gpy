# Fixture theme for the cross-shell segment golden test (#844): powerline
# delimiters with `match_bg` / `transparent` colors, bright (`br*`) and hex colors, no
# segment templates, so every segment is drawn by the shell itself.

[ui]
prompt_icon = "❯"
prompt_color = "brgreen"
root_prompt_icon = "!❯!"
root_prompt_color = "red"
two_line = true

[ui.prompt_open]
icon = ""
icon_color = "transparent"
bg_color = "transparent"

[ui.prompt_close]
icon = ""
icon_color = "match_bg"
bg_color = "black"

[ui.segment_open]
icon = ""
icon_color = "match_bg"
bg_color = "transparent"

[ui.segment_close]
icon = ""
icon_color = "match_bg"
bg_color = "transparent"

[segments.clock]
text_color = "white"
bg_color = "transparent"
time_format = "12"
show_leading_zero = true

[segments.status]
ok_icon = "✔"
ok_text_color = "black"
ok_bg_color = "#00aa55"
fail_icon = "✖"
fail_text_color = "brwhite"
fail_bg_color = "brred"

[segments.hostname]
text_color = "black"
bg_color = "brblue"
icon = "🌐"
show_always = true

[segments.username]
text_color = "white"
bg_color = "brblack"
show_always = true
