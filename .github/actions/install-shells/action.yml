name: Install shells and shell-suite prerequisites
description: >-
  Everything the shell suites and shell-driving Rust tests need. Under CI a
  missing prerequisite fails a test instead of skipping it.

runs:
  using: composite
  steps:
    # Starship's version and per-platform digests come from
    # benchmarks/compare-starship/versions.lock: a pinned tarball checked
    # against its digest (from the release's .sha256 asset), not a piped
    # installer or whatever Homebrew has. Runs before the per-OS installs, so
    # on macOS it sees Bash 3.2 (no ${VAR^^} or other Bash 4 expansions).
    - name: Install pinned Starship
      shell: bash
      run: |
        set -euo pipefail
        lock=benchmarks/compare-starship/versions.lock
        lock_get() { sed -n "s/^$1=//p" "$lock"; }

        case "$(uname -s)" in
          Darwin) STAR_OS=apple-darwin ;;
          Linux) STAR_OS=unknown-linux-musl ;;
          *) echo "::error::no pinned starship tarball for $(uname -s)"; exit 1 ;;
        esac
        case "$(uname -m)" in
          arm64 | aarch64) ARCH=aarch64 ;;
          x86_64 | amd64) ARCH=x86_64 ;;
          *) echo "::error::no pinned starship tarball for $(uname -m)"; exit 1 ;;
        esac
        triple="${ARCH}-${STAR_OS}"
        key="$(printf 'STARSHIP_SHA256_%s_%s' "$ARCH" "${STAR_OS//-/_}" | tr '[:lower:]' '[:upper:]')"
        ver="$(lock_get STARSHIP_PINNED)"
        sha="$(lock_get "$key")"
        [ -n "$ver" ] || { echo "::error::$lock has no STARSHIP_PINNED"; exit 1; }
        [ -n "$sha" ] || { echo "::error::$lock has no $key for $triple"; exit 1; }

        starship_tmp="$(mktemp -d)"
        starship_tar="$starship_tmp/starship.tar.gz"
        curl --proto '=https' --tlsv1.2 -fsSL -o "$starship_tar" \
          "https://github.com/starship/starship/releases/download/v${ver}/starship-${triple}.tar.gz"
        if [ "$(uname -s)" = Darwin ]; then
          echo "${sha}  ${starship_tar}" | shasum -a 256 -c -
        else
          echo "${sha}  ${starship_tar}" | sha256sum -c -
        fi
        tar -xzf "$starship_tar" -C "$starship_tmp" starship
        sudo install -d /usr/local/bin
        sudo install -m 0755 "$starship_tmp/starship" /usr/local/bin/starship
        rm -rf "$starship_tmp"
        starship --version

    # Fish 4 from the project PPA (apt has 3.7). shellcheck comes from
    # install-action instead, so every runner lints with one version.
    - name: Install shells and prerequisites (Linux)
      if: runner.os == 'Linux'
      shell: bash
      run: |
        set -euo pipefail
        sudo add-apt-repository -y ppa:fish-shell/release-4
        sudo apt-get update
        sudo apt-get install -y fish zsh socat netcat-openbsd python3 jq zip unzip hyperfine
        fish --version

    # macOS's bash is 3.2 (no associative arrays); quality-check.sh picks the
    # Homebrew one.
    - name: Install shells and prerequisites (macOS)
      if: runner.os == 'macOS'
      shell: bash
      env:
        HOMEBREW_NO_AUTO_UPDATE: "1"
        HOMEBREW_NO_INSTALL_CLEANUP: "1"
      run: |
        brew install fish zsh bash socat jq hyperfine
        fish --version
