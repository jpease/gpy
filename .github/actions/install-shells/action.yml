name: Install shells and shell-suite prerequisites
description: >-
  Every binary the Fish, Bash and Zsh suites and the Rust integration targets
  that drive a shell need on a GitHub-hosted runner (#650). Under CI a missing
  prerequisite is a failed test, not a skip, so this list must stay complete.
  Used by pr-gate.yml and release.yml; tests/bash/ci_gate_shape.test.bash pins
  its contents.

runs:
  using: composite
  steps:
    # Fish 4 from the project PPA (apt's 3.7 makes the plugin E2E and the
    # Fish-4-syntax tests skip), zsh, socat and netcat for the IPC edge
    # suites, python3 for the pty driver and fake listeners, jq for the JSON
    # assertions, zip and unzip for the release-packaging tests, hyperfine for
    # the perf budgets, and starship for the parity suites. shellcheck is not
    # here: the workflows install it through install-action so every runner
    # lints with the same version (apt's 0.9 flags SC2317 on trap handlers that
    # the 0.11 the gate was written against understands).
    - name: Install shells and prerequisites (Linux)
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo add-apt-repository -y ppa:fish-shell/release-4
        sudo apt-get update
        sudo apt-get install -y fish zsh socat netcat-openbsd python3 jq zip unzip hyperfine
        curl -sS https://starship.rs/install.sh | sh -s -- -y
        fish --version
        starship --version

    # The runner's system bash is 3.2, which lacks features the bash suites
    # use (associative arrays) and resets traps in subshells, so install a
    # current bash; quality-check.sh picks it for the bash suites. macOS
    # ships netcat (nc) and python3 itself.
    - name: Install shells and prerequisites (macOS)
      if: runner.os == 'macOS'
      shell: bash
      env:
        HOMEBREW_NO_AUTO_UPDATE: "1"
        HOMEBREW_NO_INSTALL_CLEANUP: "1"
      run: |
        brew install fish zsh bash socat jq hyperfine starship
        fish --version
        starship --version
