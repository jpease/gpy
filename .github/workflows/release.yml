name: Release

# Rebuilt in #492 for the current repository layout. The previous version
# validated root-level `core/`, `segments/`, and `themes/` Fish paths that
# moved under `fish/` long ago, apt-installed a nonexistent `timeout` package,
# computed a Cargo version it never compared against the tag, packaged every
# file with `2>/dev/null || echo "... may be missing"` so an empty archive
# still went green, and published notes linking three deleted files plus four
# install methods this project does not ship.
#
# The packaging and release-note logic now lives in scripts/package-release.sh
# and scripts/release-notes.sh so both are exercised by
# tests/bash/release_packaging.test.bash on every quality-check run, rather
# than only when a tag is pushed.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., v1.0.0)'
        required: true
        type: string
      publish:
        description: 'Create the GitHub release (a tag push always publishes; a manual run only builds, packages and smoke-tests unless this is set)'
        required: false
        type: boolean
        default: false

# Least privilege (#506): the token is read-only unless a job below asks for more.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTC_WRAPPER: ""
  # Oldest glibc the Linux release binaries may require (#694): Ubuntu 20.04
  # and Debian 11 ship 2.31. The Linux legs link against it with
  # cargo-zigbuild, scripts/check-glibc-floor.sh enforces it on every Linux
  # binary, the smoke job runs the x86_64 binaries in GPY_GLIBC_FLOOR_IMAGE
  # (a distro whose glibc IS the floor), and docs/INSTALL.md states it.
  # tests/bash/release_glibc_floor.test.bash keeps all four in step.
  GPY_GLIBC_FLOOR: "2.31"
  GPY_GLIBC_FLOOR_IMAGE: ubuntu:20.04

jobs:
  validate:
    name: Validate Release
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # Resolved once and passed downstream as a job output so the package and
      # release jobs cannot disagree with the version this job validated.
      - name: Resolve and validate version
        id: version
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
          REF_NAME: ${{ github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            VERSION="$INPUT_VERSION"
          else
            VERSION="$REF_NAME"
          fi
          echo "Release version: $VERSION"

          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid version format: $VERSION (expected v1.2.3)"
            exit 1
          fi
          BARE="${VERSION#v}"

          # Every place the version is declared must already agree with the
          # tag. The old job read Cargo.toml's version and then never compared
          # it, so a tag could ship binaries reporting a different version.
          CARGO_VERSION="$(grep -m1 '^version = ' gpy-agent/Cargo.toml | sed 's/version = "\(.*\)"/\1/')"
          if [ "$CARGO_VERSION" != "$BARE" ]; then
            echo "::error::gpy-agent/Cargo.toml declares $CARGO_VERSION but the tag is $VERSION"
            exit 1
          fi

          FISHER_VERSION="$(grep -m1 '"version"' fish/fisher.json | sed 's/.*"version": *"\([^"]*\)".*/\1/')"
          if [ "$FISHER_VERSION" != "$BARE" ]; then
            echo "::error::fish/fisher.json declares $FISHER_VERSION but the tag is $VERSION"
            exit 1
          fi

          if ! grep -q "^## \[$BARE\]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## [$BARE]' section; release notes are generated from it"
            exit 1
          fi

          echo "version=$VERSION" >>"$GITHUB_OUTPUT"
          echo "Version metadata is consistent across Cargo.toml, fisher.json, and CHANGELOG.md"

      - name: Install Rust toolchain
        # No `toolchain:` input: the action resolves the pin from
        # gpy-agent/rust-toolchain.toml, which `rust-src-dir` points it at.
        # See that file for why CI must not install @stable (#189, #518).
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          rust-src-dir: gpy-agent
          cache: false
          components: clippy, rustfmt

      - name: Verify the pinned toolchain is active
        shell: bash
        run: ./scripts/check-active-toolchain.sh

      - name: Cache cargo build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: gpy-agent

      - name: Install Rust tooling (nextest, audit, deny)
        uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        with:
          tool: cargo-nextest,cargo-audit,cargo-deny,just,shellcheck

      - name: Install moon
        # `just lint` is `moon run gpy-agent:clippy` (#584).
        uses: moonrepo/setup-toolchain@261c62cb5b0f580c7be7c8cd0f023a2e96756095 # v0.6.4
        with:
          auto-install: false

      - name: Install shells and shell-suite prerequisites
        # The same list pr-gate.yml installs (#650), from the same action:
        # under CI a missing prerequisite fails the test that needs it
        # instead of skipping. Includes hyperfine for the perf budgets below.
        uses: ./.github/actions/install-shells

      # The same gate a PR runs (pr-gate.yml), so a tag cannot ship something
      # that would not have merged. `just lint` was missing here until #651,
      # so a tag could ship code the PR gate would have rejected.
      - name: Rust toolchain gate
        run: just check-rust

      - name: Moon lint gate (#584)
        run: just lint

      - name: Shell integration gate
        run: just check-shell

      # tests/performance-baselines.json is enforced by nothing else in a
      # hook or workflow (the pre-push canary only warns); a tag is the one
      # place the budgets must hold (#652). This runs on a shared GitHub-hosted
      # runner, which is noisy: the budgets are the file's loose `max` ceilings
      # (not the `target` figures) plus the scripts' own tolerance, so they
      # catch an order-of-magnitude regression, not a few percent.
      - name: Performance budgets
        run: just bench-ci

  build:
    name: Build Release Binaries
    needs: validate
    timeout-minutes: 60
    strategy:
      matrix:
        include:
          # `cargo build --profile release-dist` produces BOTH binaries in a
          # single invocation, so each row builds once and uploads two
          # artifacts: the agent daemon (artifact_name/asset_name) and the
          # user-facing CLI (cli_artifact_name/cli_asset_name). No extra
          # matrix rows -- that would recompile the whole workspace a second
          # time per target (#327).
          #
          # The asset_name values are the contract with the installers:
          # install-oneline.sh downloads them straight from the release, and
          # scripts/package-release.sh renames each artifact to its asset name
          # under bin/ because install.sh resolves bin/<asset_name>. Adding or
          # renaming a row here means updating EXPECTED_ASSETS in that script
          # and the platform `case` blocks in install.sh / install-oneline.sh:
          # tests/bash/release_asset_contract.test.bash derives each row's
          # asset names from its target triple and diffs the matrix against
          # both consumers, so a half-finished rename fails the gate (#493).
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: gpy-agent
            asset_name: gpy-agent-linux-x86_64
            cli_artifact_name: gpy
            cli_asset_name: gpy-linux-x86_64
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            artifact_name: gpy-agent
            asset_name: gpy-agent-linux-aarch64
            cli_artifact_name: gpy
            cli_asset_name: gpy-linux-aarch64
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact_name: gpy-agent
            asset_name: gpy-agent-macos-x86_64
            cli_artifact_name: gpy
            cli_asset_name: gpy-macos-x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: gpy-agent
            asset_name: gpy-agent-macos-aarch64
            cli_artifact_name: gpy
            cli_asset_name: gpy-macos-aarch64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: gpy-agent.exe
            asset_name: gpy-agent-windows-x86_64.exe
            cli_artifact_name: gpy.exe
            cli_asset_name: gpy-windows-x86_64.exe

    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        # No `toolchain:` input: the action resolves the pin from
        # gpy-agent/rust-toolchain.toml, which `rust-src-dir` points it at.
        # See that file for why CI must not install @stable (#189, #518).
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          rust-src-dir: gpy-agent
          # No Swatinem step in this job, so keep the action's own cache.
          target: ${{ matrix.target }}

      - name: Verify the pinned toolchain is active
        shell: bash
        run: ./scripts/check-active-toolchain.sh

      # Linux legs link against the glibc floor instead of the runner's own
      # glibc (#694): a plain `cargo build` on ubuntu-latest (glibc 2.39)
      # produced binaries that do not start on Ubuntu 22.04/20.04 or Debian
      # 11/12. cargo-zigbuild links against zig's glibc stubs for the version
      # in the `<triple>.<glibc>` target suffix, and cross-links aarch64
      # without a gcc cross toolchain. Versions are pinned to a pair
      # cargo-zigbuild's own CI tests together.
      - name: Install zig (Linux)
        if: endsWith(matrix.target, '-unknown-linux-gnu')
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.16.0

      - name: Install cargo-zigbuild (Linux)
        if: endsWith(matrix.target, '-unknown-linux-gnu')
        uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        with:
          tool: cargo-zigbuild@0.23.4

      - name: Build release binary
        working-directory: gpy-agent
        # --locked: Cargo.lock is committed, so a release build is reproducible
        # and fails loudly if the lock has drifted from Cargo.toml.
        # zigbuild drops the `.<glibc>` suffix from the output directory, so
        # the artifacts stay at target/<triple>/release-dist/ for every leg.
        run: |
          case "${{ matrix.target }}" in
            *-unknown-linux-gnu)
              cargo zigbuild --locked --profile release-dist --target "${{ matrix.target }}.${GPY_GLIBC_FLOOR}"
              ;;
            *)
              cargo build --locked --profile release-dist --target ${{ matrix.target }}
              ;;
          esac
        shell: bash

      # Release-blocking: a Linux binary that needs a newer glibc than the
      # documented floor fails here instead of on the user's machine. Also
      # proves Rust std's pidfd_spawnp/pidfd_getpid (GLIBC_2.39) did not end
      # up as hard references against the stub libc (they link weak and
      # unversioned). The runner's stock objdump reads the aarch64 binaries'
      # dynamic symbol table too, so no cross binutils are needed.
      - name: Enforce the glibc floor (Linux)
        if: endsWith(matrix.target, '-unknown-linux-gnu')
        shell: bash
        run: |
          for bin in ${{ matrix.artifact_name }} ${{ matrix.cli_artifact_name }}; do
            ./scripts/check-glibc-floor.sh "gpy-agent/target/${{ matrix.target }}/release-dist/$bin" "$GPY_GLIBC_FLOOR"
          done

      - name: Upload agent binary artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.asset_name }}
          path: gpy-agent/target/${{ matrix.target }}/release-dist/${{ matrix.artifact_name }}
          if-no-files-found: error

      - name: Upload CLI binary artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.cli_asset_name }}
          path: gpy-agent/target/${{ matrix.target }}/release-dist/${{ matrix.cli_artifact_name }}
          if-no-files-found: error

  package:
    name: Create Release Package
    needs: [validate, build]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Download all artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: release-artifacts

      # cargo metadata needs a toolchain; the SBOM is derived from the
      # committed Cargo.lock, not from a build. Deliberately no
      # check-active-toolchain.sh step here, unlike every other job that
      # installs a toolchain: nothing in this job compiles, so which rustc is
      # active cannot change the output.
      - name: Install Rust toolchain
        # No `toolchain:` input: the action resolves the pin from
        # gpy-agent/rust-toolchain.toml, which `rust-src-dir` points it at.
        # See that file for why CI must not install @stable (#189, #518).
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          rust-src-dir: gpy-agent
          cache: false

      # CycloneDX SBOM of the dependency graph the binaries were built from
      # (#494). Ships both inside the archive and as a standalone release
      # asset. package-release.sh refuses to run without either --sbom or an
      # explicit --no-sbom, so this can never be skipped by accident.
      - name: Generate SBOM
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: ./scripts/generate-sbom.sh --version "$VERSION" --output sbom.cdx.json

      # Fail-closed packaging: a missing shell file, a missing build artifact,
      # an archive that does not contain what install.sh and Fisher reach for,
      # or a checksum sidecar that does not match its file aborts the release.
      # Covered locally by tests/bash/release_packaging.test.bash.
      - name: Build release archives
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: ./scripts/package-release.sh --version "$VERSION" --artifacts release-artifacts --out . --sbom sbom.cdx.json

      # One artifact carries the archives, the asset-named binaries, the SBOM
      # and every checksum, so create-release downloads a single,
      # already-verified payload instead of re-deriving per-platform paths from
      # the build matrix. gpy-release/bin/* picks up both the binaries and the
      # per-binary .sha256 sidecars, which is where install-oneline.sh fetches
      # its verification metadata from.
      - name: Upload release payload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gpy-release-package
          path: |
            gpy-release.tar.gz
            gpy-release.zip
            fisher-gpy.tar.gz
            gpy-sbom.cdx.json
            SHA256SUMS
            *.sha256
            gpy-release/bin/*
          if-no-files-found: error

  smoke:
    # Run what is about to be published (#652): the archive's install.sh,
    # both `--version`s, a oneshot render, a responding agent, and one prompt
    # per shell on Linux and on macOS (the arm64 runner runs the aarch64
    # binaries; the x86_64 macOS binaries are built and checksummed but
    # not run); the two .exe `--version`s and `gpy --help` on Windows
    # (CLI-only). The macOS leg used to be left out because that runner billed
    # 10x on the private repository; hosted runners are free now (#556).
    name: Smoke-run packaged binaries (${{ matrix.os }})
    needs: [validate, package]
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Download release payload
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: gpy-release-package
          path: dist

      - name: Install shells (Linux and macOS)
        if: runner.os != 'Windows'
        uses: ./.github/actions/install-shells

      - name: Smoke-run the packaged binaries
        shell: bash
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: ./scripts/smoke-release.sh --package dist --version "$VERSION"

      # The packaged x86_64 binaries must start on the oldest distro the docs
      # promise (#694), not just on the runner's glibc 2.39. Docker on the
      # Linux runner costs no extra minutes. The aarch64 binaries are covered
      # by the build job's objdump floor check, which needs no qemu. Taken
      # from the archive because download-artifact drops the exec bit.
      - name: Run the x86_64 binaries on the glibc floor (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          floor_dir="$(mktemp -d)"
          tar -xzf dist/gpy-release.tar.gz -C "$floor_dir"
          docker run --rm -v "$floor_dir/gpy-release/bin:/b:ro" "$GPY_GLIBC_FLOOR_IMAGE" sh -ec '
            ldd --version | head -n 1
            /b/gpy-agent-linux-x86_64 --version
            /b/gpy-linux-x86_64 --version
          '

  create-release:
    name: Create GitHub Release
    needs: [validate, build, package, smoke]
    # A tag push always publishes. A manual dispatch is a dry run of everything
    # above (validate, build, package, smoke) unless `publish` is set, so the
    # whole pipeline can be exercised without creating a release.
    if: ${{ github.event_name == 'push' || inputs.publish }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      # Build-provenance attestation (#494): id-token signs the Sigstore
      # bundle, attestations writes it to the repository's attestation store.
      id-token: write
      attestations: write
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Download release payload
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: gpy-release-package
          path: dist

      # Ties every published artifact to the workflow run, commit and builder
      # that produced it, verifiable with `gh attestation verify <file> --repo
      # jpease/gpy`. Checksums prove a download matches what the release page
      # says; an attestation proves the release page itself came from this
      # repository's CI.
      #
      # Free for public repositories only, which this one now is.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: |
            dist/gpy-release.tar.gz
            dist/gpy-release.zip
            dist/fisher-gpy.tar.gz
            dist/gpy-sbom.cdx.json
            dist/gpy-release/bin/*
            !dist/gpy-release/bin/*.sha256

      # Body text comes from the CHANGELOG section for this version and the
      # asset table from the binaries actually built, so nothing in the notes
      # can drift from the repository the way the old hardcoded body did.
      # generate_release_notes appends GitHub's own commit/PR summary below it.
      - name: Generate release notes
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: ./scripts/release-notes.sh --version "$VERSION" --assets dist/gpy-release/bin --output release_notes.md

      - name: Create release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          name: GPY ${{ needs.validate.outputs.version }}
          tag_name: ${{ needs.validate.outputs.version }}
          body_path: release_notes.md
          # gpy-release/bin/* publishes each binary next to its .sha256
          # sidecar, which is the exact URL install-oneline.sh fetches
          # (<asset>.sha256 beside <asset>). SHA256SUMS is the aggregate
          # manifest for verifying a whole release by hand.
          files: |
            dist/gpy-release.tar.gz
            dist/gpy-release.zip
            dist/fisher-gpy.tar.gz
            dist/gpy-sbom.cdx.json
            dist/SHA256SUMS
            dist/*.sha256
            dist/gpy-release/bin/*
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
          generate_release_notes: true
