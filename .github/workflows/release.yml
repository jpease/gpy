name: Release

# Validates the tag against every declared version, proves or runs the full
# PR gate (reusable gate-legs.yml and windows-gate.yml, plus fresh-install; see
# `proven` below), always runs the performance budgets, builds, packages
# (scripts/package-release.sh, fail-closed), smoke-tests the archive, and
# publishes.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., v1.0.0)'
        required: true
        type: string
      publish:
        description: 'Create the GitHub release (a tag push always publishes; a manual run only builds, packages and smoke-tests unless this is set)'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

# One release per version at a time; a re-run queues instead of racing the
# artifact uploads or the tag creation.
concurrency:
  group: release-${{ github.event.inputs.version || github.ref_name }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUSTC_WRAPPER: ""
  # Oldest glibc the Linux binaries may require (Ubuntu 20.04, Debian 11).
  # Kept in step with docs/INSTALL.md by tests/repo/release_glibc_floor.test.bash.
  GPY_GLIBC_FLOOR: "2.31"
  GPY_GLIBC_FLOOR_IMAGE: ubuntu:20.04

jobs:
  validate:
    name: Validate Release
    runs-on: ubuntu-latest
    timeout-minutes: 90
    # Job-level reads for the proof lookup (scripts/release-gate-proven.sh).
    permissions:
      contents: read
      actions: read
      pull-requests: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      gate-proven: ${{ steps.proven.outputs.proven }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      # Do not re-run what already passed on unchanged code: if the PR that
      # produced this commit passed gate-result on a head commit with the same
      # git tree, the gate legs below are skipped. Any doubt (no merged PR,
      # different tree, missing or failed check, API error) runs the full gate.
      - name: Check whether the PR gate already proved this tree
        id: proven
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          if ! ./scripts/release-gate-proven.sh --sha "$GITHUB_SHA" --repo "$REPO" >proof.out; then
            printf 'proven=false\nreason=proof script failed; running the full gate\n' >proof.out
          fi
          cat proof.out >>"$GITHUB_OUTPUT"
          if grep -qx 'proven=true' proof.out; then
            echo "::notice title=Release gate::SKIPPED, $(sed -n 's/^reason=//p' proof.out)"
          else
            echo "::notice title=Release gate::FULL GATE, $(sed -n 's/^reason=//p' proof.out)"
          fi
          rm -f proof.out

      # A published release must come from main's history.
      - name: Require the release commit to be on main
        if: ${{ github.event_name == 'push' || inputs.publish }}
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "::error::$GITHUB_SHA is not on main"; exit 1; }

      # Passed downstream so later jobs use the version validated here.
      - name: Resolve and validate version
        id: version
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
          REF_NAME: ${{ github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            VERSION="$INPUT_VERSION"
          else
            VERSION="$REF_NAME"
          fi
          echo "Release version: $VERSION"

          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid version format: $VERSION (expected v1.2.3)"
            exit 1
          fi
          BARE="${VERSION#v}"

          CARGO_VERSION="$(grep -m1 '^version = ' gpy-agent/Cargo.toml | sed 's/version = "\(.*\)"/\1/')"
          if [ "$CARGO_VERSION" != "$BARE" ]; then
            echo "::error::gpy-agent/Cargo.toml declares $CARGO_VERSION but the tag is $VERSION"
            exit 1
          fi

          if ! grep -q "^## \[$BARE\]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## [$BARE]' section; release notes are generated from it"
            exit 1
          fi

          echo "version=$VERSION" >>"$GITHUB_OUTPUT"
          echo "Version metadata is consistent across Cargo.toml and CHANGELOG.md"

  # Everything below runs the same legs a PR does, by calling the workflows
  # the PR gate calls, so the unproven path cannot drift into a weaker gate.
  # Skipped only when `validate` found the PR gate already green on this exact
  # tree. (`new-allows` is not repeated: it diffs a PR against its base, and a
  # tagged commit on main has no such diff.)
  gate-legs:
    name: Gate legs
    needs: validate
    if: ${{ needs.validate.outputs.gate-proven != 'true' }}
    uses: ./.github/workflows/gate-legs.yml
    with:
      cache: true
      save-cache: false

  windows-gate:
    name: Windows gate
    needs: validate
    if: ${{ needs.validate.outputs.gate-proven != 'true' }}
    uses: ./.github/workflows/windows-gate.yml

  fresh-install:
    name: Fresh install in a clean container
    needs: validate
    if: ${{ needs.validate.outputs.gate-proven != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build the image and run the fresh install
        run: ./scripts/test-fresh-install.sh

  # Never skipped, even on a proven tree: `just bench-ci` adds the end-to-end
  # budgets (ci-bench.sh) that no PR job runs, and re-runs the micro-benchmark
  # budgets on the exact tree being shipped. Shared runners are noisy, so
  # these are the loose `max` ceilings (plus tolerance): they catch
  # order-of-magnitude regressions, not a few percent.
  perf:
    name: Performance budgets
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Rust
        uses: ./.github/actions/setup-rust
        with:
          shared-key: rust
          save-if: "false"

      - name: Install just
        uses: taiki-e/install-action@3a3daafd3b7f23b8f65d9f5ba2db203fb59b79e2 # v2.90.2
        with:
          tool: just

      - name: Install shells and shell-suite prerequisites
        uses: ./.github/actions/install-shells

      - name: Performance budgets
        run: just bench-ci

  # One verdict for build to depend on: validate and perf must succeed; the
  # gate jobs must succeed or have been skipped as proven.
  release-gate:
    name: Release gate
    if: ${{ always() }}
    needs: [validate, gate-legs, windows-gate, fresh-install, perf]
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Every required job succeeded or was proven
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          bad="$(echo "$NEEDS" | jq -r 'to_entries[]
            | select(.value.result != "success")
            | select((.key == "validate" or .key == "perf") or .value.result != "skipped")
            | .key')"
          if [ -n "$bad" ]; then
            echo "::error::release gate job(s) did not succeed: $(echo "$bad" | tr '\n' ' ')"
            exit 1
          fi

  build:
    name: Build Release Binaries
    needs: [validate, release-gate]
    # release-gate runs on `always()` so a proven gate (its legs skipped) still
    # passes; without a status function here the implicit success() would skip
    # this job because an ancestor (gate-legs) was skipped.
    if: ${{ !cancelled() && needs.validate.result == 'success' && needs.release-gate.result == 'success' }}
    timeout-minutes: 60
    strategy:
      matrix:
        include:
          # One build yields both binaries (agent + CLI). asset_name is the
          # installers' contract; renaming a row means updating
          # EXPECTED_ASSETS in scripts/package-release.sh and the platform
          # cases in install.sh / install-oneline.sh
          # (tests/repo/release_asset_contract.test.bash).
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: gpy-agent
            asset_name: gpy-agent-linux-x86_64
            cli_artifact_name: gpy
            cli_asset_name: gpy-linux-x86_64
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            artifact_name: gpy-agent
            asset_name: gpy-agent-linux-aarch64
            cli_artifact_name: gpy
            cli_asset_name: gpy-linux-aarch64
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact_name: gpy-agent
            asset_name: gpy-agent-macos-x86_64
            cli_artifact_name: gpy
            cli_asset_name: gpy-macos-x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: gpy-agent
            asset_name: gpy-agent-macos-aarch64
            cli_artifact_name: gpy
            cli_asset_name: gpy-macos-aarch64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: gpy-agent.exe
            asset_name: gpy-agent-windows-x86_64.exe
            cli_artifact_name: gpy.exe
            cli_asset_name: gpy-windows-x86_64.exe

    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Rust
        uses: ./.github/actions/setup-rust
        with:
          target: ${{ matrix.target }}
          cache-on-failure: "true"

      # Link Linux binaries against the glibc floor via zig's stubs (a plain
      # build on ubuntu-latest needs glibc 2.39); also cross-links aarch64.
      # zig/cargo-zigbuild versions are a pair cargo-zigbuild's CI tests.
      - name: Install zig (Linux)
        if: endsWith(matrix.target, '-unknown-linux-gnu')
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.16.0

      - name: Install cargo-zigbuild (Linux)
        if: endsWith(matrix.target, '-unknown-linux-gnu')
        uses: taiki-e/install-action@3a3daafd3b7f23b8f65d9f5ba2db203fb59b79e2 # v2.90.2
        with:
          tool: cargo-zigbuild@0.23.4

      - name: Build release binary
        working-directory: gpy-agent
        # zigbuild drops the `.<glibc>` suffix from the output directory.
        run: |
          case "${{ matrix.target }}" in
            *-unknown-linux-gnu)
              cargo zigbuild --locked --profile release-dist --target "${{ matrix.target }}.${GPY_GLIBC_FLOOR}"
              ;;
            *)
              cargo build --locked --profile release-dist --target ${{ matrix.target }}
              ;;
          esac
        shell: bash

      # Also proves std's pidfd_spawnp/pidfd_getpid (GLIBC_2.39) linked weak,
      # not as hard references. Stock objdump reads aarch64 binaries too.
      - name: Enforce the glibc floor (Linux)
        if: endsWith(matrix.target, '-unknown-linux-gnu')
        shell: bash
        run: |
          for bin in ${{ matrix.artifact_name }} ${{ matrix.cli_artifact_name }}; do
            ./scripts/check-glibc-floor.sh "gpy-agent/target/${{ matrix.target }}/release-dist/$bin" "$GPY_GLIBC_FLOOR"
          done

      - name: Upload agent binary artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.asset_name }}
          path: gpy-agent/target/${{ matrix.target }}/release-dist/${{ matrix.artifact_name }}
          if-no-files-found: error

      - name: Upload CLI binary artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.cli_asset_name }}
          path: gpy-agent/target/${{ matrix.target }}/release-dist/${{ matrix.cli_artifact_name }}
          if-no-files-found: error

  package:
    name: Create Release Package
    needs: [validate, build]
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download all artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: release-artifacts

      # Only for cargo metadata (SBOM from Cargo.lock); nothing compiles here,
      # so no check-active-toolchain.sh step.
      - name: Set up Rust
        uses: ./.github/actions/setup-rust
        with:
          check-pin: "false"
          cache: "false"

      # package-release.sh requires --sbom or an explicit --no-sbom.
      - name: Generate SBOM
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: ./scripts/generate-sbom.sh --version "$VERSION" --output sbom.cdx.json

      # Fail-closed: any missing file or mismatched checksum aborts the release.
      - name: Build release archives
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: ./scripts/package-release.sh --version "$VERSION" --artifacts release-artifacts --out package-out --sbom sbom.cdx.json

      # One already-verified payload for create-release; bin/* includes the
      # per-binary .sha256 sidecars install-oneline.sh fetches.
      - name: Upload release payload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gpy-release-package
          path: |
            package-out/gpy-release.tar.gz
            package-out/gpy-release.zip
            package-out/gpy-shell-files.tar.gz
            package-out/install-oneline.sh
            package-out/gpy-sbom.cdx.json
            package-out/SHA256SUMS
            package-out/*.sha256
            package-out/gpy-release/bin/*
          if-no-files-found: error

  smoke:
    # Run what is about to be published: install.sh from the archive,
    # `--version`, a oneshot render and a prompt per shell on Linux/macOS
    # (arm64 runner); `--version` and `gpy --help` on Windows (CLI-only).
    name: Smoke-run packaged binaries (${{ matrix.os }})
    needs: [validate, package]
    if: ${{ !cancelled() && needs.package.result == 'success' }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download release payload
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: gpy-release-package
          path: dist

      - name: Install shells (Linux and macOS)
        if: runner.os != 'Windows'
        uses: ./.github/actions/install-shells

      - name: Smoke-run the packaged binaries
        shell: bash
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: ./scripts/smoke-release.sh --package dist --version "$VERSION"

      # The x86_64 binaries must start on the oldest promised distro; aarch64
      # is covered by the build job's objdump check. Taken from the archive
      # because download-artifact drops the exec bit.
      - name: Run the x86_64 binaries on the glibc floor (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          floor_dir="$(mktemp -d)"
          tar -xzf dist/gpy-release.tar.gz -C "$floor_dir"
          docker run --rm -v "$floor_dir/gpy-release/bin:/b:ro" "$GPY_GLIBC_FLOOR_IMAGE" sh -ec '
            ldd --version | head -n 1
            /b/gpy-agent-linux-x86_64 --version
            /b/gpy-linux-x86_64 --version
          '

  create-release:
    name: Create GitHub Release
    needs: [validate, build, package, smoke]
    # A manual dispatch is a dry run unless `publish` is set. Publish only when
    # every upstream job succeeded; `!cancelled()` keeps a skipped gate leg
    # (a proven gate) from skipping this job through the implicit success().
    if: >-
      ${{ !cancelled() && (github.event_name == 'push' || inputs.publish)
      && needs.build.result == 'success' && needs.package.result == 'success'
      && needs.smoke.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      # id-token signs the provenance bundle; attestations stores it.
      id-token: write
      attestations: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download release payload
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: gpy-release-package
          path: dist

      # Verifiable with `gh attestation verify <file> --repo jpease/gpy`.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/gpy-release.tar.gz
            dist/gpy-release.zip
            dist/gpy-shell-files.tar.gz
            dist/install-oneline.sh
            dist/gpy-sbom.cdx.json
            dist/gpy-release/bin/*
            !dist/gpy-release/bin/*.sha256

      # Notes from the CHANGELOG section plus the built assets; GitHub's
      # generated summary is appended.
      - name: Generate release notes
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: ./scripts/release-notes.sh --version "$VERSION" --assets dist/gpy-release/bin --output release_notes.md

      - name: Create release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          name: GPY ${{ needs.validate.outputs.version }}
          tag_name: ${{ needs.validate.outputs.version }}
          # A manual dispatch creates the tag; pin it to the commit built.
          target_commitish: ${{ github.sha }}
          body_path: release_notes.md
          # Each binary sits next to its .sha256, the URL install-oneline.sh
          # fetches. SHA256SUMS is for verifying a release by hand.
          files: |
            dist/gpy-release.tar.gz
            dist/gpy-release.zip
            dist/gpy-shell-files.tar.gz
            dist/install-oneline.sh
            dist/gpy-sbom.cdx.json
            dist/SHA256SUMS
            dist/*.sha256
            dist/gpy-release/bin/*
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
          generate_release_notes: true
