name: PR Quality Gate

# The full gate on every pull request: Rust toolchain, strict lint and the
# Fish/Bash/Zsh integration suites on Linux and macOS, the CLI-only Windows
# leg, and a clean-container fresh install, plus the non-gating coverage and
# performance jobs. The local hooks are only the cheap checks (the strict clippy
# pass on commit and push); everything heavy runs here, so a push is fast and CI
# stays comprehensive.
#
# The required status check is `gate-result`. Every leg is its own job, so a
# failure in one never hides the verdict of another (#651), and the
# `gate-result` job at the bottom fails unless every leg succeeded. Require
# that one name in the branch ruleset rather than the individual legs, whose
# names carry the OS matrix.
#
# History: the automatic triggers were switched off on 2026-09-02, and macOS
# was split into a manual-only job, to stop the private repository's 10x macOS
# minute multiplier burning the account's allowance (#556). Hosted-runner
# minutes are free and unlimited for a public repository, which removes the
# only reason for either decision: the triggers are back, macOS is back in the
# automatic matrix (the 2026-09-03 "macOS stays manual" decision was about
# cost, not coverage, and it reverses with the cost), and nothing here is
# opt-in any more.
#
# Fork safety: `pull_request`, never `pull_request_target`. A fork's PR runs
# this file from its own branch with a read-only token and no secrets, and
# nothing below uses either. Keep it that way: a `pull_request_target` or a
# secret in this workflow would hand an untrusted PR the repository's trust.
#
# The Windows leg (windows-gate.yml, #482/#653) is CLI-only: native Windows
# has no shell integration, the agent's IPC is a Unix socket. It mirrors
# cross-platform-test.yml's Windows leg by being the same reusable workflow.
# config::manager::tests::poll_fallback_reloads_without_any_watcher_running is
# a known intermittent timing flake on that leg (#482); re-run the failed job
# once before treating a red Windows result as a real regression.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

# Least privilege (#506): the token is read-only unless a job below asks for more.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTC_WRAPPER: ""

# A new push to a PR supersedes the run in flight; a manual dispatch groups by
# its ref the same way.
concurrency:
  group: pr-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust gate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        # No `toolchain:` input: the action resolves the pin from
        # gpy-agent/rust-toolchain.toml, which `rust-src-dir` points it at.
        # See that file for why CI must not install @stable (#189, #518).
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          rust-src-dir: gpy-agent
          cache: false
          components: clippy, rustfmt

      - name: Verify the pinned toolchain is active
        shell: bash
        run: ./scripts/check-active-toolchain.sh

      - name: Cache cargo build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: gpy-agent

      - name: Install Rust tooling (nextest, audit, deny)
        uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        with:
          tool: cargo-nextest,cargo-audit,cargo-deny,just

      # The Rust integration targets drive real shells (fish_integration_tests,
      # the plugin runtime E2E), and under CI a missing shell fails them.
      - name: Install shells and shell-suite prerequisites
        uses: ./.github/actions/install-shells

      - name: Rust toolchain gate
        run: just check-rust

  lint:
    # `just lint` is `moon run gpy-agent:clippy` (#584): the strict
    # nursery/cargo/restriction lint layer on top of the baseline `cargo
    # clippy` the Rust gate already runs.
    name: Lint gate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          rust-src-dir: gpy-agent
          cache: false
          components: clippy, rustfmt

      - name: Verify the pinned toolchain is active
        shell: bash
        run: ./scripts/check-active-toolchain.sh

      - name: Cache cargo build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: gpy-agent

      - name: Install just
        uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        with:
          tool: just

      - name: Install moon
        uses: moonrepo/setup-toolchain@261c62cb5b0f580c7be7c8cd0f023a2e96756095 # v0.6.4
        with:
          auto-install: false

      # On a pull_request moon diffs against $GITHUB_BASE_REF, which a shallow
      # checkout does not have as a local ref ("fatal: ambiguous argument
      # 'main'"). The lint does not depend on the diff, so give moon a ref by
      # that name at HEAD.
      - name: Give moon a base ref (pull_request only)
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: git branch -f "$BASE_REF" HEAD

      - name: Moon lint gate (#584)
        run: just lint

  shell:
    name: Shell gate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          rust-src-dir: gpy-agent
          cache: false

      - name: Verify the pinned toolchain is active
        shell: bash
        run: ./scripts/check-active-toolchain.sh

      - name: Cache cargo build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: gpy-agent

      # shellcheck comes from here rather than apt so every runner lints with
      # one version; cargo-audit backs the dependency-advisory claims test,
      # which fails under CI when it cannot scan the lockfile (#650).
      - name: Install just, shellcheck and cargo-audit
        uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        with:
          tool: just,shellcheck,cargo-audit

      # Every prerequisite the suites need (#650): Fish 4, zsh, bash, socat,
      # netcat, python3, jq, shellcheck and starship. A missing one is a
      # failed test under CI, never a skip.
      - name: Install shells and shell-suite prerequisites
        uses: ./.github/actions/install-shells

      - name: Shell integration gate
        run: just check-shell

  coverage:
    # Non-gating (#654): a line-coverage figure for gpy-agent, printed in the
    # log and uploaded as lcov.info. No threshold yet; the number is recorded
    # in docs/dev/testing.md. Not a `needs` of gate-result, so it can never
    # block a merge.
    name: Coverage (non-gating)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    continue-on-error: true

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        # llvm-tools-preview backs cargo-llvm-cov.
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          rust-src-dir: gpy-agent
          cache: false
          components: clippy, rustfmt, llvm-tools-preview

      - name: Verify the pinned toolchain is active
        shell: bash
        run: ./scripts/check-active-toolchain.sh

      - name: Cache cargo build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: gpy-agent

      - name: Install Rust tooling (nextest, llvm-cov)
        uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        with:
          tool: cargo-nextest,cargo-llvm-cov,just

      - name: Install shells and shell-suite prerequisites
        uses: ./.github/actions/install-shells

      - name: Coverage
        run: just coverage

      - name: Upload coverage artifact
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-lcov
          path: gpy-agent/lcov.info
          if-no-files-found: warn

  perf:
    # Performance on every push to a pull request. Two checks, both on one
    # ubuntu runner so base and head are measured on the same machine:
    #
    #   1. the absolute budgets in tests/performance-baselines.json
    #      (`bench.sh --ci`): IPC round trip, cold git status, cache and
    #      config/theme loading, version spawn, language detection;
    #   2. the base-vs-head canary (`perf-canary.sh`): the PR's base commit and
    #      its head built and benchmarked back to back, in warn mode.
    #
    # Non-gating until the variance of a shared runner is known: a hosted
    # runner is noisier than the maintainer's machine, and a gate that cries
    # wolf gets disabled. Read the job summary and the `perf-results`
    # artifact on every PR; make it a `needs` of gate-result (and drop
    # `continue-on-error`) once the budgets have held across enough runs.
    # Not a `needs` of gate-result, so it can never block a merge yet.
    name: Performance (non-gating)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    continue-on-error: true

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The canary builds the PR's base commit in a worktree.
          fetch-depth: 0
          persist-credentials: false

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          rust-src-dir: gpy-agent
          cache: false

      - name: Verify the pinned toolchain is active
        shell: bash
        run: ./scripts/check-active-toolchain.sh

      - name: Cache cargo build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: gpy-agent

      - name: Absolute performance budgets
        run: ./scripts/bench.sh --ci

      - name: Base-vs-head canary
        if: ${{ github.event_name == 'pull_request' && !cancelled() }}
        env:
          GPY_PERF_CANARY_BASE_REF: ${{ github.event.pull_request.base.sha }}
        run: |
          ./scripts/perf-canary.sh --mode warn 2>&1 | tee perf-canary.txt
          {
            echo '### perf-canary (base vs head, same runner)'
            echo '```'
            cat perf-canary.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload performance results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: perf-results
          path: |
            bench-results.json
            perf-canary.txt
          if-no-files-found: warn

  fresh-install:
    # A stock ubuntu:24.04 container with an empty $HOME installs GPY from
    # an archive built from this checkout and renders one prompt in fish,
    # zsh and bash (#652). See tests/docker/Dockerfile.fresh-install and
    # scripts/test-fresh-install.sh.
    name: Fresh install in a clean container
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build the image and run the fresh install
        run: ./scripts/test-fresh-install.sh

  windows-gate:
    # The steps live in windows-gate.yml, shared with cross-platform-test.yml
    # (#653).
    uses: ./.github/workflows/windows-gate.yml

  gate-result:
    # The one stable name to require in the branch ruleset. `if: always()` so
    # it still runs, and fails, when a leg failed or was cancelled: a skipped
    # required job would otherwise read as "not run" rather than red, and a
    # job that never started reports no status at all. Each leg is listed in
    # `needs` explicitly; add every new gating job here
    # (tests/bash/ci_gate_shape.test.bash checks this list covers each job).
    name: gate-result
    if: ${{ always() }}
    needs: [rust, lint, shell, fresh-install, windows-gate]
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Every gating leg succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          bad="$(echo "$NEEDS" | jq -r 'to_entries[] | select(.value.result != "success") | .key')"
          if [ -n "$bad" ]; then
            echo "::error::gating leg(s) did not succeed: $(echo "$bad" | tr '\n' ' ')"
            exit 1
          fi
