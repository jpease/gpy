name: PR Quality Gate

# Rust and shell gates on Linux and macOS, the CLI-only Windows leg and a
# clean-container install, plus non-gating coverage and perf jobs.
#
# Require only `gate-result` in the branch ruleset; it fails unless every
# gating leg succeeded.
#
# `pull_request`, never `pull_request_target`, and no secrets: a fork's PR
# runs this file with a read-only token.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTC_WRAPPER: ""

concurrency:
  group: pr-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust gate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        # No `toolchain:` input: resolved from gpy-agent/rust-toolchain.toml.
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          rust-src-dir: gpy-agent
          cache: false
          components: clippy, rustfmt

      - name: Verify the pinned toolchain is active
        shell: bash
        run: ./scripts/check-active-toolchain.sh

      - name: Cache cargo build
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: gpy-agent

      - name: Install Rust tooling (nextest, audit, deny)
        uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-nextest,cargo-audit,cargo-deny,just

      # Some Rust integration targets drive real shells.
      - name: Install shells and shell-suite prerequisites
        uses: ./.github/actions/install-shells

      - name: Rust toolchain gate
        run: just check-rust

  shell:
    name: Shell gate (${{ matrix.os }}, ${{ matrix.parts }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        # Two shards of `quality-check.sh --shell-only` per OS, balanced on
        # measured wall time (jpease/gpy-archive#977): the Bash suite alone,
        # and everything else. Together they must cover every part
        # (tests/bash/ci_gate_shape).
        parts: [bash, "checks,fish,zsh"]

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          rust-src-dir: gpy-agent
          cache: false

      - name: Verify the pinned toolchain is active
        shell: bash
        run: ./scripts/check-active-toolchain.sh

      - name: Cache cargo build
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: gpy-agent

      # One shellcheck version on every runner; cargo-audit backs the
      # dependency-advisory claims test.
      - name: Install just, shellcheck and cargo-audit
        uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: just,shellcheck,cargo-audit

      - name: Install shells and shell-suite prerequisites
        uses: ./.github/actions/install-shells

      - name: Shell integration gate
        env:
          SHELL_PARTS: ${{ matrix.parts }}
        run: just check-shell "$SHELL_PARTS"

  coverage:
    # Non-gating: not a `needs` of gate-result.
    name: Coverage (non-gating)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    continue-on-error: true

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          rust-src-dir: gpy-agent
          cache: false
          components: clippy, rustfmt, llvm-tools-preview

      - name: Verify the pinned toolchain is active
        shell: bash
        run: ./scripts/check-active-toolchain.sh

      - name: Cache cargo build
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: gpy-agent

      - name: Install Rust tooling (nextest, llvm-cov)
        uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-nextest,cargo-llvm-cov,just

      - name: Install shells and shell-suite prerequisites
        uses: ./.github/actions/install-shells

      - name: Coverage
        run: just coverage

      - name: Upload coverage artifact
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-lcov
          path: gpy-agent/lcov.info
          if-no-files-found: warn

  perf:
    # Absolute budgets (tests/performance-baselines.json) plus a base-vs-head
    # canary on the same runner. Non-gating until shared-runner variance is
    # known; then add it to gate-result's `needs`.
    name: Performance (non-gating)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    continue-on-error: true

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # The canary builds the PR's base commit in a worktree.
          fetch-depth: 0
          persist-credentials: false

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          rust-src-dir: gpy-agent
          cache: false

      - name: Verify the pinned toolchain is active
        shell: bash
        run: ./scripts/check-active-toolchain.sh

      - name: Cache cargo build
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: gpy-agent

      - name: Absolute performance budgets
        run: ./scripts/bench.sh --ci

      - name: Base-vs-head canary
        if: ${{ github.event_name == 'pull_request' && !cancelled() }}
        env:
          GPY_PERF_CANARY_BASE_REF: ${{ github.event.pull_request.base.sha }}
        run: |
          ./scripts/perf-canary.sh --mode warn 2>&1 | tee perf-canary.txt
          {
            echo '### perf-canary (base vs head, same runner)'
            echo '```'
            cat perf-canary.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload performance results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: perf-results
          path: |
            bench-results.json
            perf-canary.txt
          if-no-files-found: warn

  fresh-install:
    # Installs from a locally built archive into a stock ubuntu:24.04 with an
    # empty $HOME and renders a prompt in each shell.
    name: Fresh install in a clean container
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Build the image and run the fresh install
        run: ./scripts/test-fresh-install.sh

  windows-gate:
    uses: ./.github/workflows/windows-gate.yml

  new-allows:
    # A new `allow` must say why (`reason = "..."`); existing ones are left.
    # A dispatch run has no PR base, so it checks against the merge base
    # with main.
    name: Reasons on new allows
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Check added allow attributes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          base="${BASE_SHA:-$(git merge-base origin/main HEAD)}"
          python3 scripts/check_new_allows.py "$base"

  gate-result:
    # `always()` so a failed or cancelled leg turns this red instead of
    # skipped. List every gating job in `needs` (tests/bash/ci_gate_shape).
    name: gate-result
    if: ${{ always() }}
    needs: [rust, shell, fresh-install, windows-gate, new-allows]
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Every gating leg succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          bad="$(echo "$NEEDS" | jq -r 'to_entries[] | select(.value.result != "success") | .key')"
          if [ -n "$bad" ]; then
            echo "::error::gating leg(s) did not succeed: $(echo "$bad" | tr '\n' ' ')"
            exit 1
          fi
