name: PR Quality Gate

# Rust and shell gates on Linux and macOS (reusable gate-legs.yml), the
# CLI-only Windows leg, a clean-container install and the absolute performance
# budgets, plus a non-gating coverage job.
#
# Require only `gate-result` in the branch ruleset; it fails unless every
# gating leg succeeded.
#
# `pull_request`, never `pull_request_target`, and no secrets: a fork's PR
# runs this file with a read-only token.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTC_WRAPPER: ""

concurrency:
  group: pr-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  gate-legs:
    # The Rust and shell legs; cross-platform-test.yml runs the same legs
    # after merge. This PR run restores the cache that run saves on main.
    uses: ./.github/workflows/gate-legs.yml
    with:
      cache: true
      save-cache: false

  coverage:
    # Non-gating: not a `needs` of gate-result.
    name: Coverage (non-gating)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    continue-on-error: true

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # llvm-cov builds with its own flags, so nothing seeded on main fits.
      - name: Set up Rust
        uses: ./.github/actions/setup-rust
        with:
          components: clippy, rustfmt, llvm-tools-preview
          shared-key: ""
          save-if: "false"

      - name: Install Rust tooling (nextest, llvm-cov)
        uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: cargo-nextest,cargo-llvm-cov,just

      - name: Install shells and shell-suite prerequisites
        uses: ./.github/actions/install-shells

      - name: Coverage
        run: just coverage

      - name: Upload coverage artifact
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-lcov
          path: gpy-agent/lcov.info
          if-no-files-found: warn

  perf:
    # The absolute micro-benchmark budgets (benchmarks/perf-budgets.json)
    # gate. The base-vs-head canary on the same runner and the strict
    # script-segment deadline are advisory: reported in the step summary only.
    name: Performance budgets
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # The canary builds the PR's base commit in a worktree.
          fetch-depth: 0
          persist-credentials: false

      # Restores the cache cross-platform-test.yml saves on main (release
      # profile and every dependency); never saves, since only main's cache
      # is readable by every PR.
      - name: Set up Rust
        uses: ./.github/actions/setup-rust
        with:
          shared-key: rust
          save-if: "false"

      - name: Absolute performance budgets
        run: ./scripts/bench.sh --ci

      # Advisory: the canary does not measure its own noise floor.
      - name: Base-vs-head canary
        continue-on-error: true
        if: ${{ github.event_name == 'pull_request' && !cancelled() }}
        env:
          GPY_PERF_CANARY_BASE_REF: ${{ github.event.pull_request.base.sha }}
        run: |
          ./scripts/perf-canary.sh --mode warn 2>&1 | tee perf-canary.txt
          {
            echo '### perf-canary (base vs head, same runner)'
            echo '```'
            cat perf-canary.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # The quiet-host acceptance of ADR-0011 Spike 2 (p99 within T + 80 ms).
      # The shell gate runs the same test with only the hang bound enforced.
      # Advisory, like the two steps below it.
      - name: Install shells for the strict deadline test
        continue-on-error: true
        if: ${{ !cancelled() }}
        uses: ./.github/actions/install-shells

      # Advisory: shared-runner timing is too noisy to gate on p99.
      - name: Script segment deadline, strict p99
        continue-on-error: true
        if: ${{ !cancelled() }}
        env:
          GPY_STRICT_DEADLINE: "1"
        run: |
          status=0
          bash tests/bash/script_segment_deadline.test.bash >deadline-strict.txt 2>&1 || status=$?
          cat deadline-strict.txt
          {
            echo '### script segment deadline (strict p99)'
            echo '```'
            cat deadline-strict.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      - name: Upload performance results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: perf-results
          path: |
            bench-results.json
            perf-canary.txt
            deadline-strict.txt
          if-no-files-found: warn

  fresh-install:
    # Installs from a locally built archive into a stock ubuntu:24.04 with an
    # empty $HOME and renders a prompt in each shell.
    name: Fresh install in a clean container
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Build the image and run the fresh install
        run: ./scripts/test-fresh-install.sh

  windows-gate:
    uses: ./.github/workflows/windows-gate.yml

  new-allows:
    # A new `allow` must say why (`reason = "..."`); existing ones are left.
    # A dispatch run has no PR base, so it checks against the merge base
    # with main.
    name: Reasons on new allows
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Check added allow attributes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          base="${BASE_SHA:-$(git merge-base origin/main HEAD)}"
          python3 scripts/check-new-allows.py "$base"

  gate-result:
    # `always()` so a failed or cancelled leg turns this red instead of
    # skipped. List every gating job in `needs` (tests/repo/ci_gate_shape).
    name: gate-result
    if: ${{ always() }}
    needs: [gate-legs, perf, fresh-install, windows-gate, new-allows]
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Every gating leg succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          bad="$(echo "$NEEDS" | jq -r 'to_entries[] | select(.value.result != "success") | .key')"
          if [ -n "$bad" ]; then
            echo "::error::gating leg(s) did not succeed: $(echo "$bad" | tr '\n' ' ')"
            exit 1
          fi
