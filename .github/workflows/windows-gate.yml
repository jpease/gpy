name: Windows gate

# The one definition of the Windows leg (#653). pr-gate.yml and
# cross-platform-test.yml both call this instead of carrying their own copy
# of the steps, so the two cannot drift apart again.
#
# What runs here, and why only this: native Windows is CLI-only -- the
# prompt integration talks to the agent over a Unix domain socket, which
# native Windows does not provide, so no Fish/Bash/Zsh suite runs. Until
# #653 the leg ran `cargo build --locked` and the library unit tests only;
# every CLI test target is an integration target excluded by `--lib`, so the
# one thing Windows is claimed to support had never been tested there. The
# five hermetic CLI targets now run through nextest after the lib tests
# (their Windows compile is reproduced first with `cargo check --locked
# --target x86_64-pc-windows-gnu --profile test` in a Linux container with
# mingw-w64, so the leg compiles the first time it runs).
#
# config::manager::tests::poll_fallback_reloads_without_any_watcher_running
# is a known intermittent timing flake on this leg (#482); re-run once
# before treating a red result as a regression.

on:
  workflow_call:
  # Dispatchable alone so the Windows leg can be re-run without the rest of
  # the PR gate.
  workflow_dispatch:

# Least privilege (#506): the token is read-only unless a job below asks for more.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTC_WRAPPER: ""
  # windows-latest ships no shell the theme-export injection-safety tests
  # can drive (its bash.exe launches and then fails, #528). Declaring that
  # lets those tests skip the shells; anywhere else a missing shell under
  # CI is a failure (#650).
  GPY_CI_NO_SHELLS: "1"

jobs:
  windows:
    name: Windows lib and CLI tests
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        # No `toolchain:` input: the action resolves the pin from
        # gpy-agent/rust-toolchain.toml, which `rust-src-dir` points it at.
        # See that file for why CI must not install @stable (#189, #518).
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          rust-src-dir: gpy-agent
          cache: false

      - name: Verify the pinned toolchain is active
        shell: bash
        run: ./scripts/check-active-toolchain.sh

      - name: Cache cargo build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: gpy-agent

      - name: Install nextest
        uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        with:
          tool: cargo-nextest

      - name: Build agent
        working-directory: gpy-agent
        # Cargo.lock is committed, so --locked gives a reproducible build and
        # fails loudly if the lock drifts from Cargo.toml.
        run: cargo build --locked --verbose

      - name: Rust lib tests
        working-directory: gpy-agent
        # Library unit tests are hermetic (no fish/agent/socket deps).
        run: cargo test --locked --lib --verbose

      - name: CLI integration tests (the targets behind the CLI-only claim)
        if: ${{ !cancelled() }}
        working-directory: gpy-agent
        # Runs even when the lib step failed, so one red step never hides the
        # other's verdict.
        # Hermetic CLI targets: each drives the built binaries through
        # CliTestEnv with an isolated HOME/XDG_* (honoured by the Windows
        # path resolver) and no running agent. Socket-dependent lifecycle
        # tests live in other targets under #[cfg(unix)].
        run: >-
          cargo nextest run --locked --no-fail-fast --features test-support
          --test gpy_cli_tests
          --test cli_config_mutation_tests
          --test theme_import_tests
          --test init_command_tests
          --test cli_integration_tests
