name: Cross-Platform Test

# Post-merge and weekly run of the PR gate's Rust and shell legs (the shared
# gate-legs.yml) on Linux and macOS, plus the Windows leg. The weekly run
# builds without the cache and catches runner-image and toolchain drift that no
# PR exercised; a push to main also seeds the build cache the PR gate restores.
on:
  push:
    branches: [main]
  schedule:
    # Mondays 09:00 UTC: runner-image and toolchain drift with no commit.
    - cron: '0 9 * * 1'
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTC_WRAPPER: ""

concurrency:
  group: cross-platform-test-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  gate-legs:
    # A push to main saves the cache every PR gate restores (a PR's own cache
    # would be visible to that PR alone). The weekly run skips the cache, so
    # it still builds cold.
    uses: ./.github/workflows/gate-legs.yml
    with:
      cache: ${{ github.event_name != 'schedule' }}
      save-cache: ${{ github.ref == 'refs/heads/main' }}

  windows-gate:
    uses: ./.github/workflows/windows-gate.yml
