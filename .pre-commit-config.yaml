# Hooks without an explicit `stages` run on commit only; clippy opts into push.
default_stages: [pre-commit]

repos:
-   repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
    -   id: check-yaml
    -   id: end-of-file-fixer
        # Golden ANSI fixtures are byte-exact contracts; never append newlines.
        exclude: ^(gpy-agent/tests/golden|tests/fixtures/prompt_golden)/.*\.ansi$
    -   id: trailing-whitespace
        # Golden ANSI fixtures are byte-exact contracts; never trim bytes.
        exclude: ^(gpy-agent/tests/golden|tests/fixtures/prompt_golden)/.*\.ansi$
    -   id: check-added-large-files
        # Recorded feature-walkthrough GIF embedded in the README (demo/README.md).
        exclude: ^assets/demo\.gif$

-   repo: local
    hooks:
    -   id: rustfmt
        name: rustfmt
        # From gpy-agent/, where rust-toolchain.toml applies, so the formatter is the pinned one the guard checks.
        entry: bash -c 'cd gpy-agent && ../scripts/check-active-toolchain.sh && rustfmt --edition 2024 "${@#gpy-agent/}"' --
        language: system
        types: [rust]
        files: ^gpy-agent/
        pass_filenames: true
    -   id: clippy
        name: clippy
        description: the gate's clippy commands (policy in gpy-agent/Cargo.toml [lints])
        entry: just lint
        language: system
        files: '(\.rs$|(^|/)Cargo\.(toml|lock)$|(^|/)\.clippy\.toml$)'
        pass_filenames: false
        stages: [pre-push]
    -   id: new-allows
        name: new-allows
        description: Reject a newly added allow attribute that has no reason
        entry: python3 scripts/check-new-allows.py --staged
        language: system
        files: '\.rs$'
        pass_filenames: false
        stages: [pre-commit]
    -   id: file-size
        name: file-size
        description: Rust files stay under 800 lines; listed larger files may not grow
        entry: python3 scripts/check-file-size.py
        language: system
        files: '\.rs$|file-size-allowlist\.txt$'
        pass_filenames: false
    -   id: fish-check
        name: fish-check
        description: Run Fish shell syntax and formatting checks
        entry: scripts/quality-check.sh --fish-only
        language: system
        files: \.fish$
        pass_filenames: false
    -   id: gitleaks
        name: gitleaks
        description: Scan staged changes for secrets
        entry: bash -c 'command -v gitleaks >/dev/null 2>&1 || exit 0; gitleaks git --staged --redact'
        language: system
        pass_filenames: false
    # Heavy gates run in CI (pr-gate.yml). Stages are deliberate: commit runs the
    # fast fixers and checks; push runs only clippy, so a --no-verify commit is
    # still linted.
