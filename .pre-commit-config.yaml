# Hooks without an explicit `stages` run on commit and on push only; the
# commit-msg shim (installed by scripts/install-hooks.sh) runs only
# raven-commit-msg instead of repeating every pre-commit check.
default_stages: [pre-commit, pre-push]

repos:
-   repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
    -   id: check-yaml
    -   id: end-of-file-fixer
        # Golden ANSI fixtures are byte-exact contracts; never append newlines.
        exclude: ^gpy-agent/tests/golden/.*\.ansi$
    -   id: trailing-whitespace
        # Golden ANSI fixtures are byte-exact contracts; never trim bytes.
        exclude: ^gpy-agent/tests/golden/.*\.ansi$
    -   id: check-added-large-files
        # Recorded feature-walkthrough GIF embedded in the README (demo/README.md).
        exclude: ^assets/demo\.gif$

-   repo: local
    hooks:
    -   id: cargo-sweep
        name: cargo-sweep
        description: Keep Rust build artifacts under control
        entry: bash -c "command -v cargo-sweep >/dev/null 2>&1 || cargo install cargo-sweep; cd gpy-agent && cargo sweep --installed"
        language: system
        files: \.rs$
        pass_filenames: false
    -   id: rustfmt
        name: rustfmt
        entry: bash -c './scripts/check-active-toolchain.sh && rustfmt --edition 2024 "$@"' --
        language: system
        types: [rust]
        files: ^gpy-agent/
        pass_filenames: true
    -   id: moon-lint
        name: moon-lint
        description: Run the stricter moon clippy gate (nursery/cargo/restriction lints, all features); a superset of plain clippy (#584)
        entry: just lint
        language: system
        files: '(\.rs$|(^|/)Cargo\.(toml|lock)$|^moon\.yml$)'
        pass_filenames: false
    -   id: fish-check
        name: fish-check
        description: Run Fish shell syntax and formatting checks
        entry: scripts/quality-check.sh --fish-only
        language: system
        files: \.fish$
        pass_filenames: false
    -   id: raven-ai-attribution
        name: raven-ai-attribution
        description: Block AI-authorship credits from leaking into staged file content
        entry: python3 .raven/git-hooks/lib/check-ai-attribution-content.py staged
        language: system
        pass_filenames: false
    -   id: raven-managed-block-integrity
        name: raven-managed-block-integrity
        description: Block direct edits inside a RAVEN:BEGIN/RAVEN:END managed block
        entry: python3 .raven/git-hooks/lib/check-managed-block-integrity.py
        language: system
        pass_filenames: false
    -   id: raven-gate-relaxation
        name: raven-gate-relaxation
        description: Block a staged blanket lint suppression that names no rule
        entry: python3 .raven/git-hooks/lib/check-gate-relaxation.py
        language: system
        pass_filenames: false
    -   id: raven-commit-msg
        name: raven-commit-msg
        description: Strip AI attribution trailers; warn on a negated closing keyword
        entry: .raven/git-hooks/commit-msg
        language: system
        stages: [commit-msg]
    -   id: gitleaks
        name: gitleaks
        description: Scan staged changes for secrets
        entry: bash -c 'command -v gitleaks >/dev/null 2>&1 || exit 0; gitleaks git --staged --redact'
        language: system
        pass_filenames: false
    # --- Pre-push ---
    # Only the cheap outbound check runs on push. The heavy gates (the Rust
    # toolchain gate, the Fish/Bash/Zsh suites, a clean rebuild) run in CI
    # (.github/workflows/pr-gate.yml) on every pull request, where Actions
    # minutes are free, and so does the perf job. `moon-lint` (the stricter
    # clippy pass) runs on commit and again on push, so a commit made with
    # --no-verify is still linted. `just check-shell`, `just check-rust` and
    # `just perf-canary` remain for a local run; none is a hook.
    -   id: raven-ai-attribution-outbound
        name: raven-ai-attribution-outbound
        description: Block AI-authorship credits from leaking into content about to be pushed
        entry: python3 .raven/git-hooks/lib/check-ai-attribution-content.py outbound
        language: system
        pass_filenames: false
        stages: [pre-push]
