# GPY configuration template (config.toml)
#
# Every setting appears at its built-in default, commented out: a key you omit
# falls back to that default, so an untouched copy changes nothing and keeps
# following future default changes. Remove the leading `#` of a setting to
# override it. Colours and segment templates live in theme files, not here.
# Field-by-field reference: docs/user/configuration-reference.md

[ui]
# Show glyphs: language icons, git icons and the powerline caps. false falls
# back to text and flat blocks that render in any font.
#show_icons = true
# Theme file stem: default, text or starship, or any file under ~/.config/gpy/themes/
#theme = "default"
# Palette file stem: default, starship, catppuccin-latte, catppuccin-frappe,
# catppuccin-macchiato, catppuccin-mocha, gruvbox-dark-medium or nord, or any
# file under ~/.config/gpy/palettes/
#palette = "default"
# Segments to render, left to right. Built in: clock, duration, language,
# directory, git, status, character, hostname, username; plugin segments too.
#enabled_segments = ["clock", "duration", "language", "directory", "git"]
# Collapse each submitted prompt to clock, prompt icon and command (Fish 4.2+, Zsh)
#transient_prompt = true
# Let `gpy setup` move a file under ~/.config/gpy/themes/ that is an unedited
# copy of a released builtin theme to <name>.toml.bak, so the builtin applies
#retire_unmodified_themes = true

[ui.directory]
# Display mode: basename, abbreviated, truncated, full
#display = "basename"
# Trailing path components kept when display = "truncated" (1-255)
#truncation_length = 3
# Prefix shown before a truncated path (e.g. "…/")
#truncation_symbol = ""
# Maximum path length to display, a character cap (1-1000)
#max_length = 80
# Anchor the path at the enclosing git repository root
#truncate_to_repo = false

[agent]
# Enable the background agent process
#enabled = true
# Request timeout in seconds (1-300)
#timeout_seconds = 5
# Enable live prompt updates via signals
#live_updates = true

[agent.supervisor]
# Restart the agent automatically when it stops
#enabled = true
# Health check interval in seconds (5-3600)
#check_interval_seconds = 30
# Maximum restart attempts before giving up (1-100)
#max_restart_attempts = 5

[git]
# Enable git status detection
#enabled = true
# Show ahead/behind commit counts
#show_upstream = true
# Git command timeout in seconds (1-600)
#timeout_seconds = 10
# Repositories to skip git detection for (performance). A repository is skipped
# when its root is at or under an entry; an entry inside a repository does not
# skip it. Entries are matched after `~` expansion and symlink resolution.
# Example: skip_paths = ["~/work/huge-monorepo", "/mnt/network-share"]
#skip_paths = []
# Maximum branch name length to display, 0-500 (0 = unlimited). Longer names
# end in an ellipsis: "feature/very-long-branch-name" -> "feature/very-long-bra…"
#max_branch_length = 0
# Maximum ahead/behind count to show (0 = unlimited); larger counts render as N+
#max_ahead_behind = 100
# Watch the working tree, not just .git, so edits update the prompt instantly
# (GPY_WATCH_WORKTREE overrides)
#watch_worktree = true
# Capture the stash count and render $stash
#stash_enabled = true
# Default glyphs for the stash, detached-HEAD and in-progress icons: unicode
# or nerd_font (needs a patched font). The branch glyph and the powerline caps
# follow ui.show_icons and need a patched font in either set.
#icon_set = "unicode"

# Git status indicators. Each line is an optional override of the default for
# icon_set; a theme's *_icon wins over it.
[git.icons]
#ahead = "↑"
#behind = "↓"
#staged = "✚"
#unstaged = "✱"
#untracked = "?"
#conflicts = "✖"
#stash = "≡"
#detached = "➦"
#in_progress = "↻"

[language]
# Enable programming language detection
#enabled = true
# Show language versions
#show_versions = true
# Language version, mise and virtualenv lookup cache TTL in hours (1-720)
#cache_ttl_hours = 24
# Specific languages to detect (empty = detect all)
# Example: enabled_languages = ["rust", "node", "python", "go"]
#enabled_languages = []
# Display mode: "icon" (the theme's symbol, else the [language.icons] entry,
# else the built-in icon, falling back to the language name when there is
# none) or "text" (always the language name)
#display = "icon"
# Which detected languages to show:
#   "all"     every detected language
#   "primary" only the dominant language (highest confidence)
#   "3"       the top N languages by confidence (any number)
#filter = "all"
# Detection strategy: markers (default; require project marker files),
# content (rank by file prevalence) or hybrid (content ranking gated by a
# marker file)
#detection_mode = "markers"
# Minimum confidence (0.0-1.0) to display a language. Confidence is 70% file
# size ratio + 30% file count ratio, so 0.05 hides languages under 5% of the
# project (e.g. a single config.js in a Rust repository). Applies to content
# and hybrid modes only.
#confidence_threshold = 0.1

# Language icons, from https://www.nerdfonts.com/cheat-sheet. The listed glyphs
# are the built-in defaults (they need a patched font and are drawn when
# ui.show_icons = true); an entry here replaces one, and a theme's <lang>_symbol
# wins over both. A language with no icon shows its name.
[language.icons]
#rust = "󱘗"      # nf-md-language_rust
#python = "󰌠"    # nf-md-language_python
#node = "󰎙"      # nf-md-nodejs
#go = "󰟓"        # nf-md-language_go
#java = "󰬷"      # nf-md-language_java
#ruby = "󰴭"      # nf-md-language_ruby
#swift = "󰛥"     # nf-md-language_swift
#elixir = ""     # nf-dev-elixir
#php = "󰌟"       # nf-md-language_php
#csharp = "󰌛"    # nf-md-language_csharp
#cpp = "󰙲"       # nf-md-language_cpp
#c = "󰙱"         # nf-md-language_c
#erlang = ""     # nf-dev-erlang
#fish = "󰈺"      # nf-md-fish

# Per-segment overrides for script plugin segments. default: none. <segment>
# names an enabled plugin segment; any setting its manifest declares is
# accepted too (see docs/user/configuration-reference.md).
#
# [plugin.<segment>]
# ttl_secs = 30
# timeout_ms = 200
