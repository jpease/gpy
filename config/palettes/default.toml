# GPY default color palette
# Maps the standard ANSI names to themselves, plus two 256-colour accent roles
# (`orange`, `brown`) used by palette-aware themes.
name = "default"
description = "GPY default palette (standard ANSI names plus orange and brown)"

[colors]
# Standard ANSI names (identity) — keeps any standard token in a format working.
black = "black"
red = "red"
green = "green"
yellow = "yellow"
blue = "blue"
magenta = "magenta"
cyan = "cyan"
white = "white"

# Bright ANSI names (identity) — keeps standard bright tokens working.
bright_black = "bright_black"
bright_red = "bright_red"
bright_green = "bright_green"
bright_yellow = "bright_yellow"
bright_blue = "bright_blue"
bright_magenta = "bright_magenta"
bright_cyan = "bright_cyan"
bright_white = "bright_white"

# Extended base24 accent roles (base09 / base0F). Honest defaults; the starship
# palette overrides `orange` to Starship's exact swift index (202).
orange = "208"
brown = "130"
