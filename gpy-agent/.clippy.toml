# Clippy configuration for gpy-agent.
# Lint levels live in Cargo.toml [lints] and the moon.yml `clippy` task; this
# file only tunes thresholds and options of lints those enable.

# Complexity thresholds
cognitive-complexity-threshold = 15
too-many-lines-threshold = 60
too-many-arguments-threshold = 5
type-complexity-threshold = 150

# Size thresholds
trivial-copy-size-limit = 32              # pass small Copy types by value
array-size-threshold = 128000             # large_stack_arrays
vec-box-size-threshold = 4096
too-large-for-stack = 200

# Boolean parameters: prefer enums / config structs
max-struct-bools = 2
max-fn-params-bools = 1

# doc_markdown: identifiers that may appear in docs without backticks
doc-valid-idents = [
    "GPY", "IPC", "JSON", "CLI", "API",
    "SIGURG", "SIGTERM", "macOS", "TOML", "UTF8",
]

# Naming
single-char-binding-names-threshold = 2   # many_single_char_names
upper-case-acronyms-aggressive = true

# wildcard_imports: also flag `use super::*` and prelude-style imports
warn-on-all-wildcard-imports = true

# Restriction lints moon.yml denies, relaxed inside #[test] / #[cfg(test)] code
allow-expect-in-tests = true
allow-unwrap-in-tests = true
allow-panic-in-tests = true
allow-dbg-in-tests = true
allow-print-in-tests = true

# Keep in step with rust-version in Cargo.toml and rust-toolchain.toml: a
# stale value silently disables every lint gated on a newer MSRV.
msrv = "1.99"

# Lint private items and allow lints to suggest signature changes on public
# items (the library has no semver guarantee).
avoid-breaking-exported-api = false
check-private-items = true
