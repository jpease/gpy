[package]
name = "gpy-agent"

description = "Fast, cross-platform agent for Git status and language detection used by the GPY prompt for Bash, Fish, and Zsh"

version = "0.6.0"
rust-version = "1.99"
edition = "2024"
authors = ["Justin Pease <536+jpease@users.noreply.github.com>"]
license = "GPL-3.0-or-later"
readme = "README.md"
repository = "https://github.com/jpease/gpy"

# Not published: a registry install would lack the fish/, bash/ and zsh/ trees.
publish = false

# Kept accurate for `cargo package --list` and source archives.
exclude = [
  "*.backup",
  "tests/snapshots/",
  "lcov.info",
  "deny.toml",
  "SCHEMA_EVOLUTION.md",
]

[lints.rust]
warnings = "deny"
unsafe_code = "deny"
missing_docs = "warn"

[lints.rustdoc]
broken_intra_doc_links = "warn"
missing_crate_level_docs = "warn"

[lints.clippy]
# The whole pedantic group. priority = -1 lets the named entries below and
# per-item allows override it.
pedantic = { level = "warn", priority = -1 }

# Panics, stray output and unfinished code.
dbg_macro = "warn"
exit = "warn"
expect_used = "warn"
get_unwrap = "warn"
panic = "warn"
print_stderr = "warn"
print_stdout = "warn"
todo = "warn"
unimplemented = "warn"
unreachable = "warn"
unwrap_used = "warn"

# Unsafe code and memory: every unsafe block states why it is sound.
clone_on_ref_ptr = "warn"
mem_forget = "warn"
rc_buffer = "warn"
undocumented_unsafe_blocks = "warn"

# Lost information and likely bugs.
create_dir = "warn"
filetype_is_file = "warn"
float_cmp_const = "warn"
lossy_float_literal = "warn"
map_err_ignore = "warn"
use_debug = "warn"

# Numeric conversions, arithmetic and indexing.
arithmetic_side_effects = "warn"
as_conversions = "warn"
default_numeric_fallback = "warn"
indexing_slicing = "warn"

# Readability.
cognitive_complexity = "warn"
empty_structs_with_brackets = "warn"
if_then_some_else_none = "warn"
multiple_inherent_impl = "warn"
rest_pat_in_fully_bound_structs = "warn"
same_name_method = "warn"
self_named_module_files = "warn"
shadow_reuse = "warn"
shadow_same = "warn"
shadow_unrelated = "warn"
str_to_string = "warn"
string_add = "warn"

# Nursery lints adopted individually.
empty_enums = "warn"
fallible_impl_from = "warn"
missing_const_for_fn = "warn"
option_if_let_else = "warn"

[dependencies]
clap = { version = "4.6", features = ["derive", "string"] }
clap_complete = "4.6"

tokio = { version = "1.53", features = ["full"] }

thiserror = "2.0"

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

toml = "1.1"
toml_edit = "0.25"

# Matcher tables only; `gengo` itself is not used because `Gengo::analyze`
# reads every file in the tree (too slow for the prompt) and pulls in gix.
gengo-language = "0.15"

notify = { version = "8.2", features = ["macos_fsevent"] }
# .gitignore matching for the watcher and the language-detection walk.
ignore = "0.4"

ratatui = "0.30"
crossterm = "0.29"

[target."cfg(unix)".dependencies]
libc = "0.2"
fork = "0.10"
nix = { version = "0.31", features = ["signal", "process", "fs", "user"] }
# Process start time, so a recycled PID is never signaled; the crate forbids
# unsafe and macOS has no /proc.
sysinfo = "0.39"

# Backs `InstantPromptCache::new_for_test` (feature `test-support`).
tempfile = { version = "3.27", optional = true }

# No Windows dependencies: Windows builds the CLI only; IPC is Unix-socket only.

[target."cfg(unix)".dev-dependencies]
# PTY-backed `init` and wizard tests.
portable-pty = "0.9"

[features]
# Library surface for integration tests and benches only. The self
# dev-dependency below turns it on for every test, bench and example build,
# so no command passes `--features`; `--lib`, release and `cargo doc` builds
# never compile it.
test-support = ["dep:tempfile"]

[dev-dependencies]
gpy-agent = { path = ".", features = ["test-support"] }
tempfile = "3.27"
serial_test = { version = "4.0", features = ["file_locks"] }
regex = "1.13"

insta = { version = "1.49", features = ["json", "redactions"] }
proptest = "1.12"

criterion = { version = "0.8", features = ["html_reports", "async_tokio"] }

# Test-only: generates the published plugin manifest JSON schemas from the
# Rust types (`cfg_attr(test, derive(JsonSchema))`); never in release builds.
schemars = "1.2"

[[bin]]
name = "gpy-agent"
path = "src/main.rs"

[[bin]]
name = "gpy"
path = "src/bin/gpy.rs"

[[bench]]
name = "template_bench"
harness = false

[[bench]]
name = "formatter_bench"
harness = false

[[bench]]
name = "ipc_bench"
harness = false

[[bench]]
name = "git_bench"
harness = false

[[bench]]
name = "cache_bench"
harness = false

[[bench]]
name = "language_bench"
harness = false

[[bench]]
name = "perf_canary_bench"
harness = false

[[bench]]
name = "agent_startup_bench"
harness = false

[[bench]]
name = "plugin_bench"
harness = false

# Local `--release` builds and `cargo bench` (the bench profile inherits this).
# Shipped binaries use `release-dist`, which inherits only `panic` from here.
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"  # Fail fast; see docs/dev/adr/adr-0008-fail-fast-on-panic.md
strip = false

[profile.fast]
inherits = "dev"
opt-level = 1
debug = false
overflow-checks = false

# Shipped binaries (build-release-binaries.sh and the release workflow).
[profile.release-dist]
inherits = "release"
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
