[package]
name = "gpy-agent"

description = "Fast, cross-platform agent for Git status and language detection used by the GPY prompt for Bash, Fish, and Zsh"

version = "0.1.0"
rust-version = "1.99"
edition = "2024"
authors = ["Justin Pease <536+jpease@users.noreply.github.com>"]
license = "GPL-3.0-or-later"
readme = "README.md"
repository = "https://github.com/jpease/gpy"

# Never published to crates.io: a registry install would ship the two binaries
# without the fish/, bash/ and zsh/ trees the prompt renders from. Distribution
# is GitHub Releases plus the jpease/homebrew-tap Homebrew tap, so the library
# surface carries no semver guarantee; see the crate root docs.
publish = false

# Keep the crate contents honest for `cargo package --list` and for anyone
# building from a source archive, even though nothing is uploaded.
exclude = [
  ".claude/",
  "*.backup",
  "tests/snapshots/",
  "lcov.info",
  "deny.toml",
  "SCHEMA_EVOLUTION.md",
]

[lints.rust]
# Promotes every warn-level lint -- rustc's own plus the clippy groups below --
# to a hard error, so a bare `cargo clippy --all-targets` enforces the same
# baseline as scripts/quality-check.sh. `just lint` (moon.yml) adds the
# stricter restriction-lint set on top.
warnings = "deny"

[lints.clippy]
# priority = -1 on both groups: lower than an unset (0) per-lint attribute,
# so an individual #[allow(clippy::some_pedantic_lint)] in code still wins
# over this crate-wide deny (Cargo requires an explicit priority whenever a
# lint name could be covered by more than one [lints] entry).
pedantic = { level = "deny", priority = -1 }

# "test-support" is referenced by name across justfile/scripts/tests/CI;
# renaming for a cosmetic clippy::cargo lint isn't worth that blast radius.
# Covers a bare `cargo clippy`; `just lint`'s explicit `-D clippy::cargo` on
# the command line outranks this table, so moon.yml also carries a matching
# `-A clippy::redundant_feature_names`.
redundant_feature_names = "allow"

[dependencies]
# CLI argument parsing
clap = { version = "4.6", features = ["derive", "string"] }
clap_complete = "4.6"

# Async runtime
tokio = { version = "1.53", features = ["full"] }

# Error handling
thiserror = "2.0"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Configuration
toml = "1.1.2"
toml_edit = "0.25.15"

# Language detection: linguist-grade matcher tables (extensions, filenames,
# path globs, interpreters, content heuristics). Only the tables are used --
# GPY owns the directory walk in src/language/detector.rs. The wrapping `gengo`
# crate is deliberately NOT a dependency: `Gengo::analyze` reads every file in
# the tree (too slow for the prompt's latency budget) and pulls in gix.
gengo-language = "0.15.0"

# File watching
notify = { version = "8.2", features = ["macos_fsevent"] }
# .gitignore matching for the worktree watcher, and the parallel walk that
# drives directory language detection (src/language/detector.rs).
ignore = "0.4"

# Terminal UI (config wizard)
ratatui = "0.30"
crossterm = "0.29"

# Cross-platform compatibility
[target."cfg(unix)".dependencies]
libc = "0.2"
fork = "0.10"
nix = { version = "0.31", features = ["signal", "process", "fs", "user"] }
# Process identity lookup (start time) for the client registry: verifies a
# PID still belongs to the process we registered before signaling it, so a
# recycled PID is never signaled. gpy-agent forbids unsafe code crate-wide,
# and macOS has no /proc, so this wraps the platform-specific (partly unsafe)
# lookups instead of us reimplementing them.
sysinfo = "0.39"

# No Windows-specific dependencies: the crate builds natively on Windows as a CLI-only target. The IPC transport is Unix-socket only (see `ipc::native_windows_unsupported`), so the agent does not run there; Fish runs under WSL.

[target."cfg(unix)".dev-dependencies]
# PTY-backed integration test for wizard terminal restoration: spawns the real
# `gpy` binary against a pseudo-terminal so the test can assert on actual
# termios state, which a `RecordingTerminalOps` unit-test double cannot prove.
# Only reachable through the `test-support` feature.
portable-pty = "0.9"

[features]
# Compiles in test-only surface (a hidden `gpy __wizard_force_fail` subcommand)
# that is otherwise absent from every binary, including release builds.
test-support = []

[dev-dependencies]
# Testing utilities
tempfile = "3.27"
futures = "0.3"
serial_test = { version = "3.4.0", features = ["file_locks"] }
regex = "1.13"

# Advanced testing
insta = { version = "1.48", features = ["json", "redactions"] }
proptest = "1.11"

# Benchmarking
criterion = { version = "0.8", features = ["html_reports", "async_tokio"] }

[[bin]]
name = "gpy-agent"
path = "src/main.rs"

[[bin]]
name = "gpy"
path = "src/bin/gpy.rs"

[[bench]]
name = "template_bench"
harness = false

[[bench]]
name = "formatter_bench"
harness = false

[[bench]]
name = "ipc_bench"
harness = false

[[bench]]
name = "git_bench"
harness = false

[[bench]]
name = "cache_bench"
harness = false

[[bench]]
name = "language_bench"
harness = false

[[bench]]
name = "perf_canary_bench"
harness = false

[[bench]]
name = "agent_startup_bench"
harness = false

# Tuned for build speed, not runtime speed: every local `--release` build
# (dev installs, scripts/quality-check.sh, shell e2e tests, benchmark scripts)
# and `cargo bench` (the bench profile inherits it) use this. Shipped binaries
# are built with `release-dist` below, so local benchmark numbers understate
# shipped performance.
[profile.release]
lto = false
codegen-units = 256
# Abort instead of unwinding; a panic terminates the process.
panic = "abort"
strip = false
opt-level = 1

# Lightly optimized dev build without debug info or overflow checks.
[profile.fast]
inherits = "dev"
opt-level = 1
debug = false
overflow-checks = false

# Profile for shipped binaries (scripts/build-release-binaries.sh and the
# release workflow): full optimization + thin LTO.
[profile.release-dist]
inherits = "release"
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
# panic = "abort" is inherited from release
